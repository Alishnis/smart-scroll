    <style>
        /* Smart Currency Display */
        .smart-currency-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(48, 202, 161, 0.3);
            transition: all 0.3s ease;
        }

        .smart-currency-display:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(48, 202, 161, 0.4);
        }

        .smart-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .smart-amount {
            font-weight: 700;
            font-size: 16px;
        }

        .smart-text {
            font-size: 12px;
            opacity: 0.9;
        }
        
        /* Feed container styles with snap scroll */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scroll-padding-top: 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .video-section {
            height: 100vh;
            display: flex;
            gap: 20px;
            padding: 20px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        
        /* Ensure proper snap behavior */
        .video-section:first-child {
            scroll-snap-align: start;
        }
        
        .video-section:last-child {
            scroll-snap-align: end;
        }
        
        /* Sticky panels */
        .video-panels {
            position: sticky;
            top: 40%;
            transform: translateY(-50%);
            height: fit-content;
            align-self: flex-start;
        }
        
        .video-card {
            background: #2E3136;
            border: 0.5px solid #EEEEEE;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 70%;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        /* Video panels */
        .video-panels {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80px;
            flex-shrink: 0;
        }
        
        .panel-item {
            width: 60px;
            height: 60px;
            background: rgba(46, 49, 54, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .panel-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .panel-item.active {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            box-shadow: 0 4px 16px rgba(48, 202, 161, 0.4);
        }
        
        .panel-icon {
            width: 24px;
            height: 24px;
            color: #FFFFFF;
            transition: all 0.2s ease;
        }
        
        .panel-item:hover .panel-icon {
            transform: scale(1.1);
        }
        
        /* Global Panel */
        .global-panel {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%) translateX(calc(100% + 20px));
            width: 400px;
            max-height: 80vh;
            background: #2C2C2E;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 0;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .global-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(-50%) translateX(0);
        }
        
        /* Panel header */
        .panel-header {
            background: #212123;
            padding: 16px 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .panel-close-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        
        .panel-close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .panel-header-icon {
            width: 20px;
            height: 20px;
            color: #FFFFFF;
        }
        
        .panel-header-title {
            color: #FFFFFF;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        
        /* Panel body */
        .panel-body {
            padding: 20px;
            max-height: calc(80vh - 80px);
            overflow-y: auto;
        }
        
        .panel-content p {
            color: #FFFFFF;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 16px 0;
        }
        
        .panel-content textarea {
            width: 100%;
            min-height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            font-family: inherit;
            padding: 12px;
        }
        
        .panel-content textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Quiz styles */
        .quiz-container {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .quiz-container h3 {
            color: #FFFFFF;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .quiz-container p {
            color: #FFFFFF;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .quiz-options label {
            display: flex;
            align-items: center;
            color: #FFFFFF;
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        
        .quiz-options label:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .quiz-options input[type="radio"] {
            margin-right: 10px;
            accent-color: #30CAA1;
        }
        
        .quiz-explanation {
            margin-top: 15px;
            padding: 12px;
            background: rgba(48, 202, 161, 0.1);
            border: 1px solid rgba(48, 202, 161, 0.3);
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 14px;
        }
        
        .quiz-explanation strong {
            color: #30CAA1;
        }

        .quiz-explanation.incorrect {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .quiz-explanation.incorrect strong {
            color: #FF6B6B;
        }

        .quiz-check-btn {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            color: #FFFFFF;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .quiz-check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(48, 202, 161, 0.4);
        }
        
        .video-player {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
        }
        
        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .video-info {
            padding: 16px;
        }
        
        .video-title {
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .video-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .video-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .video-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 12px;
                cursor: pointer;
                transition: all 0.2s ease;
            }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #30CAA1;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: white;
            font-size: 18px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            padding: 16px;
            color: #ff6b6b;
            text-align: center;
        }

        /* Исправление позиционирования контента */
        .main {
            padding-top: 0 !important;
        }
        
        .page {
            padding-top: 0 !important;
        }
        
        .feed-container {
            margin-top: 0 !important;
        }
    </style>
</head>

    <div class="page">

    <!-- Загрузка единого навбара -->
    <script>
        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });
    </script>

    <script>
        // API ключи (не храните реальные ключи в репозитории)
        const YOUTUBE_API_KEY = 'AIzaSyBNS4Da0y7tWCdfMKP2HXbN7YDJkhIjgXY';
        // AI-суммаризация и квизы идут через серверный прокси (cors-proxy.js /ai/chat) — ключ там, не здесь

        // Принудительный mock режим (для тестирования)
        const FORCE_MOCK_MODE = false;
        
        let currentQuery = 'programming';
        
        // Загружаем видео при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadVideos(currentQuery);
        });
        
        async function loadVideos(query) {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = '<div class="loading"><div><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="animation: spin 1s linear infinite; margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Загружаем видео...</div></div>';

            // Принудительный mock режим
            if (FORCE_MOCK_MODE) {
                console.log('Принудительный mock режим включен');
                loadMockVideos(query);
                return;
            }

            try {
                // Реальный поиск через YouTube API
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=10&key=${YOUTUBE_API_KEY}`;
                
                console.log('Searching with URL:', searchUrl);
                console.log('API Key:', YOUTUBE_API_KEY);
                
                const response = await fetch(searchUrl, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/json',
                    }
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }
                
                const searchData = await response.json();
                
                if (!searchData.items || searchData.items.length === 0) {
                    feedContainer.innerHTML = '<div class="error"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>Видео не найдены</div>';
                    return;
                }
                
                // Получаем статистику для каждого видео
                const videoIds = searchData.items.map(item => item.id.videoId).join(',');
                const statsUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
                
                const statsResponse = await fetch(statsUrl);
                const statsData = await statsResponse.json();
                
                // Объединяем данные поиска и статистики
                const videosWithStats = searchData.items.map(video => {
                    const stats = statsData.items.find(item => item.id === video.id.videoId);
                    return {
                        id: video.id,
                        snippet: video.snippet,
                        statistics: stats ? stats.statistics : null
                    };
                });
                
                displayVideos(videosWithStats);
                
            } catch (error) {
                console.error('Ошибка загрузки видео:', error);
                
                // Показываем более детальную информацию об ошибке
                let errorMessage = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>Ошибка загрузки видео';
                if (error.message.includes('400')) {
                    errorMessage += '<br><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>Проблема с API ключом YouTube';
                } else if (error.message.includes('403')) {
                    if (error.message.includes('quota')) {
                        errorMessage += '<br><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Превышена квота YouTube API';
                        errorMessage += '<br><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Попробуйте позже или используйте другой API ключ';
                    } else {
                        errorMessage += '<br><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>Доступ запрещен к YouTube API';
                    }
                } else if (error.message.includes('CORS')) {
                    errorMessage += '<br><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Проблема с CORS';
                } else {
                    errorMessage += '<br><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Проверьте подключение к интернету';
                }
                
                feedContainer.innerHTML = `<div class="error">${errorMessage}</div>`;
                
                // Загружаем mock данные при ошибке
                console.log('Загружаем mock данные из-за ошибки');
                loadMockVideos(query);
            }
        }

            // Mock данные с популярными образовательными видео

                return (number / 1000).toFixed(1) + 'K';

        // Функция для удаления markdown форматирования
        function stripMarkdown(text) {
            if (!text) return '';
            
            return text
                // Удаляем заголовки (##, ###, ####)
                .replace(/^#{1,6}\s+/gm, '')
                // Удаляем жирный текст (**text** или __text__)
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/__(.*?)__/g, '$1')
                // Удаляем курсив (*text* или _text_)
                .replace(/\*(.*?)\*/g, '$1')
                .replace(/_(.*?)_/g, '$1')
                // Удаляем зачеркнутый текст (~~text~~)
                .replace(/~~(.*?)~~/g, '$1')
                // Удаляем код (`code`)
                .replace(/`(.*?)`/g, '$1')
                // Удаляем ссылки [text](url)
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                // Удаляем маркеры списков (-, *, +)
                .replace(/^[\s]*[-*+]\s+/gm, '• ')
                // Удаляем нумерованные списки (1., 2., etc.)
                .replace(/^[\s]*\d+\.\s+/gm, '• ')
                // Очищаем лишние пробелы
                .replace(/\n\s*\n/g, '\n')
                .trim();
        }

                    panelBody.innerHTML = '<p><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg><span data-i18n-en="Failed to generate quiz. Please try again later.">Ошибка при генерации квиза. Попробуйте позже.</span></p>';
                    if (window.SmartScrollI18N) window.SmartScrollI18N.refresh();
                }
            }
        }
        
        function getUiLang() {
            return (window.SmartScrollI18N && window.SmartScrollI18N.getLang) ? window.SmartScrollI18N.getLang() : 'ru';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        async function generateVideoSummaryWithOpenAI(videoContent) {

Создай содержание в следующем формате:

                const response = await fetch('/ai/chat', {

                            }

                });

                if (!response.ok) {
                throw new Error(`AI proxy error: ${response.status}`);
                }

                const data = await response.json();
            return data.choices[0].message.content;
        }
        
        function getVideoIdFromSection(videoSection) {
            const iframe = videoSection.querySelector('iframe');
            if (iframe) {
                const src = iframe.src;
                const match = src.match(/embed\/([^?]+)/);
                return match ? match[1] : null;
            }
            return null;
        }
        
        async function getVideoTranscript(videoId) {
            if (!videoId) {
                throw new Error('Video ID не найден');
            }
            
            // Используем YouTube Transcript API через CORS proxy
            const transcriptUrl = `https://www.youtube.com/api/timedtext?v=${videoId}&lang=ru&fmt=json3`;
            
            try {
                const response = await fetch(`/proxy?url=${encodeURIComponent(transcriptUrl)}`);
                if (!response.ok) {
                    throw new Error('Транскрипт недоступен');
                }
                
                const data = await response.json();
                if (data.events && data.events.length > 0) {
                    return data.events
                        .map(event => event.segs ? event.segs.map(seg => seg.utf8).join('') : '')
                        .join(' ')
                        .trim();
                }
                throw new Error('Транскрипт пуст');
            } catch (error) {
                console.log('Ошибка получения транскрипта:', error);
                throw error;
            }
        }
        
        async function generateQuizWithOpenAI(videoContent) {
            const lang = getUiLang();
            const prompt = lang === 'en' ? `Based on this video, create 5 quiz questions in English:

${videoContent}

Each question needs exactly 4 answer options and one correct answer.

Respond with ONLY a valid JSON array, no markdown code fences, no text before or after it. Exact shape:
[
  {"question": "Question text", "options": ["Option A", "Option B", "Option C", "Option D"], "correctIndex": 0, "explanation": "Brief explanation of the correct answer"}
]
"correctIndex" is the 0-based index into "options".` : `На основе этого видео создай 5 вопросов для квиза на русском языке:

${videoContent}

У каждого вопроса должно быть ровно 4 варианта ответа и один правильный.

Ответь ТОЛЬКО валидным JSON-массивом, без markdown-разметки, без текста до или после. Формат строго такой:
[
  {"question": "Текст вопроса", "options": ["Вариант A", "Вариант B", "Вариант C", "Вариант D"], "correctIndex": 0, "explanation": "Краткое объяснение правильного ответа"}
]
"correctIndex" — индекс правильного варианта в "options", начиная с 0.`;

            const response = await fetch('/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    messages: [
                        {
                            role: 'system',
                            content: lang === 'en'
                                ? 'You generate quizzes. Respond with ONLY valid JSON — no markdown, no commentary.'
                                : 'Ты генератор квизов. Отвечай ТОЛЬКО валидным JSON — без markdown и лишнего текста.'
                        },
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    max_tokens: 2000,
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                throw new Error(`AI proxy error: ${response.status}`);
            }

            const data = await response.json();
            const questions = parseQuizJSON(data.choices[0].message.content);
            const quizHTML = renderQuizHTML(questions);

            // Add event listener for check button after quiz is loaded
            setTimeout(() => {
                const checkBtn = document.querySelector('.quiz-check-btn');
                if (checkBtn) {
                    checkBtn.addEventListener('click', checkQuizAnswers);
                }
            }, 100);

            return quizHTML;
        }

        // Модель отдаёт текст правильного ответа, а не индекс — числовой индекс,
        // отдельный от списка options, слишком легко рассинхронизировать
        // (проверено на нескольких моделях: объяснение верное, а индекс — нет).
        // Индекс вычисляем сами через сопоставление строк, это надёжнее.
        function resolveCorrectIndex(q) {
            const normalize = (s) => String(s).trim().toLowerCase();
            const target = normalize(q.correctAnswer);
            let index = q.options.findIndex((opt) => normalize(opt) === target);
            if (index === -1) {
                index = q.options.findIndex((opt) => normalize(opt).includes(target) || target.includes(normalize(opt)));
            }
            return index === -1 ? 0 : index;
        }

        function parseQuizJSON(raw) {
            const cleaned = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '');
            const questions = JSON.parse(cleaned);
            if (!Array.isArray(questions) || questions.length === 0) {
                throw new Error('Некорректный формат квиза от модели');
            }
            questions.forEach((q) => {
                q.correctIndex = resolveCorrectIndex(q);
            });
            return questions;
        }

        // Строим разметку сами (не доверяем LLM генерацию HTML/имён radio-групп) —
        // это гарантирует уникальный name на каждый вопрос и надёжную проверку ответов.
        function renderQuizHTML(questions) {
            const letters = ['A', 'B', 'C', 'D'];
            const questionsHTML = questions.map((q, qIndex) => `
                <div class="quiz-container" data-correct="${q.correctIndex}">
                    <h3><span data-i18n-en="Question">Вопрос</span> ${qIndex + 1}:</h3>
                    <p>${escapeHtml(q.question)}</p>
                    <div class="quiz-options">
                        ${q.options.map((opt, oIndex) => `
                            <label><input type="radio" name="q${qIndex}" value="${oIndex}"> ${letters[oIndex]}) ${escapeHtml(opt)}</label>
                        `).join('')}
                    </div>
                    <div class="quiz-explanation" style="display:none;">
                        <strong data-i18n-en="Correct answer:">Правильный ответ:</strong> ${letters[q.correctIndex]}<br>
                        <strong data-i18n-en="Explanation:">Объяснение:</strong> ${escapeHtml(q.explanation)}
                    </div>
                </div>
            `).join('');

            return `${questionsHTML}<button class="quiz-check-btn" data-i18n-en="Check answers">Проверить ответы</button>`;
        }
        
        function checkQuizAnswers() {
            const quizContainers = document.querySelectorAll('.quiz-container');
            let correctAnswers = 0;
            const totalQuestions = quizContainers.length;

            quizContainers.forEach((container) => {
                const explanation = container.querySelector('.quiz-explanation');
                const selectedAnswer = container.querySelector('input[type="radio"]:checked');
                const isCorrect = !!selectedAnswer && selectedAnswer.value === container.dataset.correct;

                if (explanation) {
                    explanation.style.display = 'block';
                    explanation.classList.toggle('incorrect', !isCorrect);
                }

                if (isCorrect) {
                    correctAnswers++;
                }
            });

            // Show results
            const resultDiv = document.createElement('div');
            resultDiv.className = 'quiz-results';
            resultDiv.style.cssText = `
                margin-top: 20px;
                padding: 15px;
                background: rgba(48, 202, 161, 0.1);
                border: 1px solid rgba(48, 202, 161, 0.3);
                border-radius: 8px;
                color: #FFFFFF;
                text-align: center;
            `;

            const percentage = Math.round((correctAnswers / totalQuestions) * 100);
            resultDiv.innerHTML = `
                <h3 data-i18n-en="Quiz Results">Результат квиза</h3>
                <p><span data-i18n-en="Correct answers:">Правильных ответов:</span> ${correctAnswers} <span data-i18n-en="out of">из</span> ${totalQuestions}</p>
                <p><span data-i18n-en="Score:">Процент:</span> ${percentage}%</p>
                ${percentage >= 80 ? '<p style="color: #30CAA1;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span data-i18n-en="Excellent!">Отлично!</span></p>' :
                  percentage >= 60 ? '<p style="color: #FFA500;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><span data-i18n-en="Good!">Хорошо!</span></p>' :
                  '<p style="color: #FF6B6B;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span data-i18n-en="Room for improvement!">Есть над чем поработать!</span></p>'}
            `;

            // Remove existing results
            const existingResults = document.querySelector('.quiz-results');
            if (existingResults) {
                existingResults.remove();
            }

            // Add new results
            const panelBody = document.getElementById('panelBody');
            if (panelBody) {
                panelBody.appendChild(resultDiv);
                if (window.SmartScrollI18N) window.SmartScrollI18N.refresh();
            }
        }
        
        // Snap scroll functionality
        let currentVideoIndex = 0;
        let isScrolling = false;
        
        function initSnapScroll() {
            const feedContainer = document.getElementById('feedContainer');
            
            // Add keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                    e.preventDefault();
                    scrollToNextVideo();
                } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                    e.preventDefault();
                    scrollToPreviousVideo();
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    scrollToVideo(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    const totalVideos = document.querySelectorAll('.video-section').length;
                    scrollToVideo(totalVideos - 1);
                }
            });
            
            // Add wheel event for smooth scrolling
            feedContainer.addEventListener('wheel', function(e) {
                e.preventDefault();
                if (isScrolling) return;
                
                const delta = e.deltaY > 0 ? 1 : -1;
                if (delta > 0) {
                    scrollToNextVideo();
                } else {
                    scrollToPreviousVideo();
                }
            });
            
            // Add touch support for mobile
            let touchStartY = 0;
            let touchStartTime = 0;
            
            feedContainer.addEventListener('touchstart', function(e) {
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            });
            
            feedContainer.addEventListener('touchend', function(e) {
                if (isScrolling) return;
                
                const touchEndY = e.changedTouches[0].clientY;
                const touchEndTime = Date.now();
                const delta = touchStartY - touchEndY;
                const timeDelta = touchEndTime - touchStartTime;
                
                // Only trigger if swipe is fast enough and far enough
                if (Math.abs(delta) > 50 && timeDelta < 300) {
                    if (delta > 0) {
                        scrollToNextVideo();
            } else {
                        scrollToPreviousVideo();
                    }
                }
            });
            
            // Update current video index on scroll
            feedContainer.addEventListener('scroll', function() {
                updateCurrentVideoIndex();
            });
        }
        
        function updateCurrentVideoIndex() {
            const feedContainer = document.getElementById('feedContainer');
            const videoSections = document.querySelectorAll('.video-section');
            const scrollTop = feedContainer.scrollTop;
            const windowHeight = window.innerHeight;
            
            for (let i = 0; i < videoSections.length; i++) {
                const sectionTop = i * windowHeight;
                const sectionBottom = (i + 1) * windowHeight;
                
                if (scrollTop >= sectionTop && scrollTop < sectionBottom) {
                    if (currentVideoIndex !== i) {
                        currentVideoIndex = i;
                        highlightCurrentVideo();
                        console.log('Current video changed to:', currentVideoIndex);
                    }
                    break;
                }
            }
        }
        
        function scrollToVideo(index) {
            if (isScrolling) return;
            isScrolling = true;
            
            // Close all panels when scrolling
            closeAllPanels();
            
            const feedContainer = document.getElementById('feedContainer');
            const videoSections = document.querySelectorAll('.video-section');
            
            if (index >= 0 && index < videoSections.length) {
                const targetScroll = index * window.innerHeight;
                
                feedContainer.scrollTo({
                    top: targetScroll,
                    behavior: 'smooth'
                });
                
                currentVideoIndex = index;
            }
            
            setTimeout(() => {
                isScrolling = false;
            }, 800);
        }
        
        function scrollToNextVideo() {
            const videoSections = document.querySelectorAll('.video-section');
            const nextIndex = Math.min(currentVideoIndex + 1, videoSections.length - 1);
            scrollToVideo(nextIndex);
        }
        
        function scrollToPreviousVideo() {
            const prevIndex = Math.max(currentVideoIndex - 1, 0);
            scrollToVideo(prevIndex);
        }
        
        // Initialize snap scroll when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize immediately
            initSnapScroll();
            
            // Initialize Smart Currency
            if (window.SmartCurrency) {
                window.SmartCurrency.updateDisplay();
                console.log('✅ Smart Currency инициализирована в ленте');
            }
            
            // Инициализация TTS
            if (window.TTSService) {
                // Проверяем настройки TTS
                const ttsSettings = localStorage.getItem('ttsSettings');
                if (ttsSettings) {
                    const settings = JSON.parse(ttsSettings);
                    if (settings.enabled) {
                        window.TTSService.enableTTS();
                        console.log('🔊 TTS автоматически включен');
                    }
                }
            }
            
            // Also initialize after videos load
            setTimeout(() => {
                updateCurrentVideoIndex();
                console.log('Snap scroll initialized, current video:', currentVideoIndex);
            }, 1000);
        });
        
        // Add visual indicator for current video (disabled)
        function highlightCurrentVideo() {
            // Visual highlighting disabled - no border or shadow
            return;
        }
    </script>
