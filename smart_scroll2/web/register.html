<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scroll - Register</title>
    <link rel="icon" type="image/png" href="template-logo.png">
    <link rel="stylesheet" href="template-styles.css">
    <link rel="stylesheet" href="auth-styles.css">
    
    <!-- Единая навигация -->
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=3" defer></script>
    
    <!-- Мониторинг яркости экрана -->
    <script src="brightness-monitor.js"></script>
    
    <!-- Auth system -->
    <script src="auth-script.js"></script>
    
    <!-- Smart Currency System -->
        <!-- Button Audio System -->
    <script src="button-audio.js"></script>
<script src="smart-currency.js"></script>
<style>
    @media (max-width: 768px) {
        .content-card {
            min-height: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .content-card__header {
            padding: 20px 20px 12px;
        }

        .content-card__title {
            font-size: 22px;
        }

        .content-card__body {
            padding: 20px;
        }

        .auth-form {
            padding: 0;
            max-width: 100%;
        }
    }

    @media (max-width: 480px) {
        .content-card__header {
            padding: 16px 16px 10px;
        }

        .content-card__title {
            font-size: 20px;
        }

        .content-card__body {
            padding: 16px;
        }

        .form-input {
            padding: 12px 14px;
        }
    }
</style>

<body>
    <div class="page">
        <!-- Единый навбар -->
        <div id="unified-navbar-container"></div>

        <!-- Main Content -->
        <main class="main">
            <div class="content">
                <!-- Main Content Area -->
                <div class="main-content">
                    <div class="content-card">
                        <div class="content-card__header">
                            <h2 class="content-card__title" data-i18n-en="Create Account">Создать аккаунт</h2>
                        </div>
                        <div class="content-card__body">
                            <form class="auth-form" id="registerForm">
                                <div class="form-group">
                                    <label for="username" class="form-label" data-i18n-en="Nickname">Никнейм</label>
                                    <input type="text" id="username" name="username" class="form-input" placeholder="Введите никнейм" data-i18n-en-placeholder="Enter nickname" required>
                                </div>

                                <div class="form-group">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" name="email" class="form-input" placeholder="Введите email" data-i18n-en-placeholder="Enter email" required>
                                </div>

                                <div class="form-group">
                                    <label for="password" class="form-label" data-i18n-en="Password">Пароль</label>
                                    <input type="password" id="password" name="password" class="form-input" placeholder="Введите пароль" data-i18n-en-placeholder="Enter password" required>
                                </div>

                                <div class="form-group">
                                    <label for="confirmPassword" class="form-label" data-i18n-en="Confirm Password">Подтвердите пароль</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Подтвердите пароль" data-i18n-en-placeholder="Confirm password" required>
                                </div>

                                <button type="submit" class="auth-button" data-i18n-en="Register">Зарегистрироваться</button>
                            </form>

                            <div class="auth-links">
                                <p><span data-i18n-en="Already have an account? ">Уже есть аккаунт? </span><a href="login.html" class="auth-link" data-i18n-en="Sign In">Войти</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Загрузка единого навбара -->
    <script>
        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });
    </script>
</body>
</html>
