<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop - SmartScroll</title>
    <link rel="stylesheet" href="template-styles.css">
    
    <!-- Единая навигация -->
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=2" defer></script>
    
    <script src="smart-currency.js"></script>
    
    <!-- Button Audio System -->
    <script src="button-audio.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            overflow-x: hidden;
            height: 100vh;
            padding-bottom: 100px; /* Отступ для нижнего навбара */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header__right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .main-content {
            margin-top: 80px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 100px; /* Отступ для нижнего навбара */
        }

        .shop-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .shop-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .shop-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .shop-categories {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .category-btn:hover,
        .category-btn.active {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(48, 202, 161, 0.3);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .shop-item {
            background: rgba(44, 44, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .shop-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-color: #30CAA1;
        }

        .shop-item.owned {
            border-color: #30CAA1;
            background: rgba(48, 202, 161, 0.1);
        }

        .shop-item.owned::before {
            content: '✓ ПРИОБРЕТЕНО';
            position: absolute;
            top: 15px;
            right: 15px;
            background: #30CAA1;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .item-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(48, 202, 161, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(48, 202, 161, 0.3);
        }

        .item-info h3 {
            color: white;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .item-info .item-type {
            color: #30CAA1;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .item-description {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-price {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #30CAA1;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .buy-btn {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(48, 202, 161, 0.3);
        }

        .buy-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .buy-btn.owned {
            background: linear-gradient(135deg, #4CAF50 0%, #45A049 100%);
        }

        .inventory-section {
            background: rgba(44, 44, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-top: 40px;
        }

        .inventory-section h2 {
            color: #30CAA1;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .inventory-item:hover {
            border-color: #30CAA1;
            background: rgba(48, 202, 161, 0.1);
        }

        .inventory-item .item-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .inventory-item h4 {
            color: white;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .inventory-item p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .empty-inventory {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            padding: 40px;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(44, 44, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #30CAA1;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        /* Navigation styles removed - using unified navbar */

        /* Responsive */
        @media (max-width: 768px) {
            .shop-grid {
                grid-template-columns: 1fr;
            }
            
            .shop-categories {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 10px;
            }
            
            .category-btn {
                white-space: nowrap;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <!-- Единый навбар -->
        <div id="unified-navbar-container"></div>

        <!-- Main Content -->
        <main class="main">
            <div class="main-content">
                <!-- Shop Header -->
                <div class="shop-header">
                    <h1>🛒 Smart Shop</h1>
                    <p data-i18n-en="Spend your Smart points on unique achievements, badges and titles">Потратьте ваши Smart очки на уникальные достижения, значки и титулы</p>
                </div>

                <!-- Stats Section -->
                <div class="stats-section">
                    <div class="stat-card">
                        <div class="stat-value" id="currentBalance">0</div>
                        <div class="stat-label" data-i18n-en="Smart points">Smart очков</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalPurchases">0</div>
                        <div class="stat-label" data-i18n-en="Purchases">Покупок</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalSpent">0</div>
                        <div class="stat-label" data-i18n-en="Spent">Потрачено</div>
                    </div>
                </div>

                <!-- Categories -->
                <div class="shop-categories">
                    <button class="category-btn active" data-category="all" data-i18n-en="All items">Все товары</button>
                    <button class="category-btn" data-category="achievements" data-i18n-en="Achievements">Достижения</button>
                    <button class="category-btn" data-category="badges" data-i18n-en="Badges">Значки</button>
                    <button class="category-btn" data-category="titles" data-i18n-en="Titles">Титулы</button>
                    <button class="category-btn" data-category="effects" data-i18n-en="Effects">Эффекты</button>
                </div>

                <!-- Shop Items -->
                <div class="shop-grid" id="shopGrid">
                    <!-- Товары будут загружены динамически -->
                </div>

                <!-- Inventory Section -->
                <div class="inventory-section">
                    <h2 data-i18n-en="🎒 My Inventory">🎒 Мой инвентарь</h2>
                    <div class="inventory-grid" id="inventoryGrid">
                        <!-- Приобретенные товары будут отображены здесь -->
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Загрузка единого навбара -->
    <script>
        // Загружаем единый навбар
        fetch('unified-navbar.html?v=2')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
                console.log('✅ Единый навбар загружен и инициализирован');
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
                // Fallback - создаем простой навбар
                document.getElementById('unified-navbar-container').innerHTML = `
                    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 10px 20px; border-radius: 20px; z-index: 1000;">
                        <a href="feed.html" style="color: white; margin: 0 10px;">Лента</a>
                        <a href="posts.html" style="color: white; margin: 0 10px;">Посты</a>
                        <a href="smart-shop.html" style="color: #30CAA1; margin: 0 10px;">Магазин</a>
                        <a href="settings.html" style="color: white; margin: 0 10px;">Настройки</a>
                        <a href="profile.html" style="color: white; margin: 0 10px;">Профиль</a>
                    </div>
                `;
            });
    </script>

    <script>
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            initializeSmartShop();
        });

        function initializeSmartShop() {
            // Инициализируем Smart Currency
            if (window.SmartCurrency) {
                window.SmartCurrency.updateDisplay();
                console.log('✅ Smart Currency инициализирована в магазине');
            }

            // Загружаем товары
            loadShopItems();
            loadInventory();
            updateStats();

            // Привязываем события
            bindEvents();
        }

        function bindEvents() {
            // Фильтрация по категориям
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Убираем активный класс со всех кнопок
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    // Добавляем активный класс к текущей кнопке
                    this.classList.add('active');
                    
                    // Фильтруем товары
                    const category = this.dataset.category;
                    filterItems(category);
                });
            });
        }

        function loadShopItems() {
            const shopItems = [
                // Достижения
                {
                    id: 'achievement_quiz_master',
                    name: 'Мастер квизов',
                    type: 'achievement',
                    category: 'achievements',
                    icon: '🎯',
                    description: 'Специальное достижение за отличные результаты в квизах',
                    price: 50,
                    rarity: 'common'
                },
                {
                    id: 'achievement_smart_collector',
                    name: 'Собиратель Smart',
                    type: 'achievement',
                    category: 'achievements',
                    icon: '💰',
                    description: 'Эксклюзивное достижение для активных пользователей',
                    price: 100,
                    rarity: 'rare'
                },
                {
                    id: 'achievement_legend',
                    name: 'Легенда SmartScroll',
                    type: 'achievement',
                    category: 'achievements',
                    icon: '👑',
                    description: 'Легендарное достижение для самых преданных пользователей',
                    price: 500,
                    rarity: 'legendary'
                },

                // Значки
                {
                    id: 'badge_brain',
                    name: 'Значок Мозга',
                    type: 'badge',
                    category: 'badges',
                    icon: '🧠',
                    description: 'Стильный значок с изображением мозга',
                    price: 25,
                    rarity: 'common'
                },
                {
                    id: 'badge_star',
                    name: 'Звездный значок',
                    type: 'badge',
                    category: 'badges',
                    icon: '⭐',
                    description: 'Блестящий звездный значок',
                    price: 75,
                    rarity: 'rare'
                },
                {
                    id: 'badge_crown',
                    name: 'Королевский значок',
                    type: 'badge',
                    category: 'badges',
                    icon: '👑',
                    description: 'Роскошный королевский значок',
                    price: 200,
                    rarity: 'epic'
                },
                {
                    id: 'badge_diamond',
                    name: 'Алмазный значок',
                    type: 'badge',
                    category: 'badges',
                    icon: '💎',
                    description: 'Редкий алмазный значок',
                    price: 300,
                    rarity: 'legendary'
                },

                // Титулы
                {
                    id: 'title_beginner',
                    name: 'Новичок',
                    type: 'title',
                    category: 'titles',
                    icon: '🌱',
                    description: 'Титул для начинающих пользователей',
                    price: 30,
                    rarity: 'common'
                },
                {
                    id: 'title_expert',
                    name: 'Эксперт',
                    type: 'title',
                    category: 'titles',
                    icon: '🎓',
                    description: 'Титул для опытных пользователей',
                    price: 150,
                    rarity: 'rare'
                },
                {
                    id: 'title_master',
                    name: 'Мастер',
                    type: 'title',
                    category: 'titles',
                    icon: '🏆',
                    description: 'Титул для мастеров SmartScroll',
                    price: 400,
                    rarity: 'epic'
                },
                {
                    id: 'title_legend',
                    name: 'Легенда',
                    type: 'title',
                    category: 'titles',
                    icon: '🌟',
                    description: 'Легендарный титул',
                    price: 1000,
                    rarity: 'legendary'
                },

                // Эффекты
                {
                    id: 'effect_glow',
                    name: 'Светящийся эффект',
                    type: 'effect',
                    category: 'effects',
                    icon: '✨',
                    description: 'Добавляет светящийся эффект к вашему профилю',
                    price: 80,
                    rarity: 'rare'
                },
                {
                    id: 'effect_rainbow',
                    name: 'Радужный эффект',
                    type: 'effect',
                    category: 'effects',
                    icon: '🌈',
                    description: 'Красивый радужный эффект',
                    price: 120,
                    rarity: 'epic'
                },
                {
                    id: 'effect_particles',
                    name: 'Эффект частиц',
                    type: 'effect',
                    category: 'effects',
                    icon: '✨',
                    description: 'Анимированные частицы вокруг профиля',
                    price: 200,
                    rarity: 'legendary'
                }
            ];

            // Сохраняем товары в localStorage
            localStorage.setItem('shopItems', JSON.stringify(shopItems));
            
            // Отображаем товары
            displayShopItems(shopItems);
        }

        function displayShopItems(items) {
            const shopGrid = document.getElementById('shopGrid');
            const currentBalance = window.SmartCurrency ? window.SmartCurrency.getPoints() : 0;
            const inventory = getInventory();

            shopGrid.innerHTML = '';

            items.forEach(item => {
                const isOwned = inventory.some(invItem => invItem.id === item.id);
                const canAfford = currentBalance >= item.price;

                const itemElement = document.createElement('div');
                itemElement.className = `shop-item ${isOwned ? 'owned' : ''}`;
                
                itemElement.innerHTML = `
                    <div class="item-header">
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <div class="item-type">${getTypeLabel(item.type)}</div>
                        </div>
                    </div>
                    <div class="item-description">${item.description}</div>
                    <div class="item-footer">
                        <div class="item-price">
                            <span class="smart-icon">🧠</span>
                            <span>${item.price}</span>
                        </div>
                        <button class="buy-btn ${isOwned ? 'owned' : ''}" 
                                onclick="purchaseItem('${item.id}')" 
                                ${isOwned || !canAfford ? 'disabled' : ''}>
                            ${isOwned ? 'Приобретено' : (canAfford ? 'Купить' : 'Недостаточно Smart')}
                        </button>
                    </div>
                `;

                shopGrid.appendChild(itemElement);
            });
        }

        function getTypeLabel(type) {
            const labels = {
                'achievement': 'Достижение',
                'badge': 'Значок',
                'title': 'Титул',
                'effect': 'Эффект'
            };
            return labels[type] || type;
        }

        function filterItems(category) {
            const allItems = JSON.parse(localStorage.getItem('shopItems') || '[]');
            let filteredItems = allItems;

            if (category !== 'all') {
                filteredItems = allItems.filter(item => item.category === category);
            }

            displayShopItems(filteredItems);
        }

        function purchaseItem(itemId) {
            if (!window.SmartCurrency) {
                alert('Система Smart Currency не инициализирована');
                return;
            }

            const allItems = JSON.parse(localStorage.getItem('shopItems') || '[]');
            const item = allItems.find(i => i.id === itemId);
            
            if (!item) {
                alert('Товар не найден');
                return;
            }

            const currentBalance = window.SmartCurrency.getPoints();
            
            if (currentBalance < item.price) {
                alert('Недостаточно Smart очков для покупки');
                return;
            }

            // Покупаем товар
            if (window.SmartCurrency.spendPoints(item.price)) {
                // Добавляем в инвентарь
                addToInventory(item);
                
                // Обновляем отображение
                updateStats();
                loadInventory();
                displayShopItems(JSON.parse(localStorage.getItem('shopItems') || '[]'));
                
                // Показываем уведомление
                showPurchaseNotification(item);
                
                console.log(`✅ Куплен товар: ${item.name} за ${item.price} Smart очков`);
            } else {
                alert('Ошибка при покупке товара');
            }
        }

        function addToInventory(item) {
            const inventory = getInventory();
            inventory.push({
                ...item,
                purchasedAt: new Date().toISOString()
            });
            localStorage.setItem('userInventory', JSON.stringify(inventory));
        }

        function getInventory() {
            return JSON.parse(localStorage.getItem('userInventory') || '[]');
        }

        function loadInventory() {
            const inventory = getInventory();
            const inventoryGrid = document.getElementById('inventoryGrid');
            
            if (inventory.length === 0) {
                inventoryGrid.innerHTML = '<div class="empty-inventory">🎒 Инвентарь пуст<br>Купите товары в магазине!</div>';
                return;
            }

            inventoryGrid.innerHTML = '';

            inventory.forEach(item => {
                const itemElement = document.createElement('div');
                itemElement.className = 'inventory-item';
                
                itemElement.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <h4>${item.name}</h4>
                    <p>${getTypeLabel(item.type)}</p>
                `;

                inventoryGrid.appendChild(itemElement);
            });
        }

        function updateStats() {
            if (!window.SmartCurrency) return;

            const currentBalance = window.SmartCurrency.getPoints();
            const inventory = getInventory();
            const totalSpent = inventory.reduce((sum, item) => sum + item.price, 0);

            document.getElementById('currentBalance').textContent = currentBalance;
            document.getElementById('totalPurchases').textContent = inventory.length;
            document.getElementById('totalSpent').textContent = totalSpent;
        }

        function showPurchaseNotification(item) {
            const notification = document.createElement('div');
            notification.className = 'smart-purchase-notification';
            notification.innerHTML = `
                <div class="purchase-content">
                    <div class="purchase-icon">${item.icon}</div>
                    <div class="purchase-text">
                        <div class="purchase-title">Покупка успешна!</div>
                        <div class="purchase-item">${item.name}</div>
                    </div>
                </div>
            `;

            // Добавляем стили для уведомления
            if (!document.getElementById('purchase-notification-styles')) {
                const style = document.createElement('style');
                style.id = 'purchase-notification-styles';
                style.textContent = `
                    .smart-purchase-notification {
                        position: fixed;
                        top: 20px;
                        right: 20px;
                        background: linear-gradient(135deg, #4CAF50 0%, #45A049 100%);
                        color: white;
                        padding: 15px 20px;
                        border-radius: 12px;
                        box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
                        z-index: 10000;
                        animation: purchaseSlideIn 0.5s ease-out;
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                        min-width: 250px;
                    }

                    .purchase-content {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                    }

                    .purchase-icon {
                        font-size: 24px;
                        animation: purchaseBounce 0.6s ease-in-out;
                    }

                    .purchase-title {
                        font-size: 16px;
                        font-weight: bold;
                        margin-bottom: 2px;
                    }

                    .purchase-item {
                        font-size: 14px;
                        opacity: 0.9;
                    }

                    @keyframes purchaseSlideIn {
                        from {
                            transform: translateX(100%);
                            opacity: 0;
                        }
                        to {
                            transform: translateX(0);
                            opacity: 1;
                        }
                    }

                    @keyframes purchaseBounce {
                        0%, 20%, 50%, 80%, 100% {
                            transform: translateY(0);
                        }
                        40% {
                            transform: translateY(-10px);
                        }
                        60% {
                            transform: translateY(-5px);
                        }
                    }
                `;
                document.head.appendChild(style);
            }

            document.body.appendChild(notification);

            // Удаляем уведомление через 3 секунды
            setTimeout(() => {
                notification.style.animation = 'purchaseSlideIn 0.3s ease-in reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
    
</body>
</html>
