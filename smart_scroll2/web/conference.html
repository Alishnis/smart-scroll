<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеоконференции - SmartScroll</title>
    <link rel="icon" type="image/png" href="template-logo.png">
    
    <!-- Единая навигация -->
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=3" defer></script>
    
    <!-- Мониторинг яркости экрана -->
    <script src="brightness-monitor.js"></script>
    
    <!-- Smart Currency System -->
    <script src="smart-currency.js"></script>
    
    <!-- Twilio Video SDK -->
    <script src="https://media.twiliocdn.com/sdk/js/video/releases/2.31.0/twilio-video.min.js"></script>
    
    <!-- Bootstrap для модальных окон -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    
        <!-- Button Audio System -->
    <script src="button-audio.js"></script>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .conference-controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .conference-controls h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn.secondary {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .btn.success {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }

        .btn.danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .video-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
        }

        .video-container.active {
            display: block;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-participant {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .video-participant.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .video-participant video {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            background: #000;
        }

        .participant-info {
            margin-top: 10px;
            font-weight: 600;
        }

        .participant-controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .control-btn.muted {
            background: #e74c3c;
        }

        .control-btn.video-off {
            background: #e74c3c;
        }

        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .status.connected {
            border-left: 4px solid #2ecc71;
        }

        .status.disconnected {
            border-left: 4px solid #e74c3c;
        }

        .room-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .room-info h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-title {
            color: #ffd700;
        }

        .modal-body input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
        }

        .modal-body input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .device-selector {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .device-selector select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-bottom: 10px;
        }

        .device-selector option {
            background: #333;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .video-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="unified-navbar-container"></div>

    <div class="container">
        <!-- Управление конференцией -->
        <div class="conference-controls">
            <h2 data-i18n-en="🎥 Conference Management">🎥 Управление конференцией</h2>

            <div class="status" id="connectionStatus">
                <strong data-i18n-en="Status:">Статус:</strong> <span data-i18n-en="Not connected">Не подключен</span>
            </div>

            <div class="room-info" id="roomInfo" style="display: none;">
                <h3 data-i18n-en="Room information">Информация о комнате</h3>
                <p><strong data-i18n-en="Room name:">Название комнаты:</strong> <span id="roomName"></span></p>
                <p><strong data-i18n-en="Your name:">Ваше имя:</strong> <span id="userName"></span></p>
                <p><strong data-i18n-en="Participants:">Участников:</strong> <span id="participantCount">0</span></p>
            </div>

            <button class="btn" id="joinRoomBtn" onclick="showJoinModal()" data-i18n-en="Join room">Присоединиться к комнате</button>
            <button class="btn secondary" id="createRoomBtn" onclick="showCreateModal()" data-i18n-en="Create room">Создать комнату</button>
            <button class="btn danger" id="leaveRoomBtn" onclick="leaveRoom()" style="display: none;" data-i18n-en="Leave room">Покинуть комнату</button>

            <div class="device-selector" id="deviceSelector" style="display: none;">
                <h3 data-i18n-en="Device settings">Настройки устройств</h3>
                <select id="cameraSelect">
                    <option value="" data-i18n-en="Select camera">Выберите камеру</option>
                </select>
                <select id="microphoneSelect">
                    <option value="" data-i18n-en="Select microphone">Выберите микрофон</option>
                </select>
                <button class="btn secondary" onclick="updateDevices()" data-i18n-en="Refresh devices">Обновить устройства</button>
            </div>
        </div>

        <!-- Видео контейнер -->
        <div class="video-container" id="videoContainer">
            <h2 data-i18n-en="📹 Conference Participants">📹 Участники конференции</h2>
            <div class="video-grid" id="videoGrid">
                <!-- Видео участников будут добавлены здесь -->
            </div>

            <div class="participant-controls" style="justify-content: center; margin-top: 20px;">
                <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="Включить/выключить микрофон" data-i18n-en-title="Toggle microphone">
                    🎤
                </button>
                <button class="control-btn" id="videoBtn" onclick="toggleVideo()" title="Включить/выключить видео" data-i18n-en-title="Toggle video">
                    📹
                </button>
                <button class="control-btn" id="screenShareBtn" onclick="toggleScreenShare()" title="Поделиться экраном" data-i18n-en-title="Share screen">
                    🖥️
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для присоединения к комнате -->
    <div class="modal fade" id="joinRoomModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n-en="Join conference">Присоединиться к конференции</h5>
                    <button type="button" class="close" data-dismiss="modal" style="color: white;">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="joinRoomName" data-i18n-en="Room name">Название комнаты</label>
                        <input type="text" id="joinRoomName" placeholder="Введите название комнаты" data-i18n-en-placeholder="Enter room name">
                    </div>
                    <div class="form-group">
                        <label for="joinUserName" data-i18n-en="Your name">Ваше имя</label>
                        <input type="text" id="joinUserName" placeholder="Введите ваше имя" data-i18n-en-placeholder="Enter your name">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" data-i18n-en="Cancel">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="joinRoom()" data-i18n-en="Join">Присоединиться</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для создания комнаты -->
    <div class="modal fade" id="createRoomModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n-en="Create conference">Создать конференцию</h5>
                    <button type="button" class="close" data-dismiss="modal" style="color: white;">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="createRoomName" data-i18n-en="Room name">Название комнаты</label>
                        <input type="text" id="createRoomName" placeholder="Введите название комнаты" data-i18n-en-placeholder="Enter room name">
                    </div>
                    <div class="form-group">
                        <label for="createUserName" data-i18n-en="Your name">Ваше имя</label>
                        <input type="text" id="createUserName" placeholder="Введите ваше имя" data-i18n-en-placeholder="Enter your name">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" data-i18n-en="Cancel">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="createRoom()" data-i18n-en="Create">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <script src="conference-service.js"></script>
    
    <!-- Загрузка единого навбара -->
    <script>
        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });
    </script>
</body>
</html>
