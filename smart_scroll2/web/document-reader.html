<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Analyzer - Smart Scroll</title>
    <link rel="icon" type="image/png" href="template-logo.png">
    <link rel="stylesheet" href="../templates/styles.css">
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=3" defer></script>
        <!-- Button Audio System -->
    <script src="button-audio.js"></script>
<style>
        /* Document Reader Specific Styles */
        .document-reader {
            background-color: #000000;
            color: #FFFFFF;
        }

        .document-reader .main {
            padding: 0 160px 120px;
            padding-bottom: 140px; /* Дополнительное место для нижнего навбара */
        }

        .document-reader .content {
            display: flex;
            gap: 16px;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            align-items: stretch;
            min-height: 600px;
        }

        .document-reader .main-content {
            flex: 2;
            min-width: 0;
        }

        .question-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-top: 16px;
        }

        .question-section__title {
            font-size: 18px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .upload-card__title {
            font-size: 18px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #111;
        }

        .upload-area:hover {
            border-color: #666;
            background: #1a1a1a;
        }

        .upload-area.dragover {
            border-color: #30CAA1;
            background: #1a1a1a;
        }

        .upload-icon {
            font-size: 3rem;
            color: #666;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #FFFFFF;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .supported-formats {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #999;
        }



        .question-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            background: #111;
            color: #FFFFFF;
            margin-bottom: 16px;
        }

        .question-input:focus {
            outline: none;
            border-color: #30CAA1;
        }

        .ask-button {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .ask-button:hover {
            box-shadow: 0 4px 16px rgba(48, 202, 161, 0.4);
            transform: translateY(-1px);
        }

        .ask-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .file-info {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .file-info strong {
            color: #FFFFFF;
        }

        .file-info span {
            color: #999;
        }

        .extracted-text {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .extracted-text h3 {
            color: #FFFFFF;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .extracted-text div {
            color: #CCC;
            line-height: 1.5;
            font-size: 14px;
        }

        .answer-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }

        .answer-section h3 {
            color: #FFFFFF;
            margin-bottom: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-text {
            color: #CCC;
            line-height: 1.6;
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #30CAA1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #2d1b1b;
            border: 1px solid #ff4444;
            color: #ff6666;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 14px;
        }

        .success {
            background: #1b2d1b;
            border: 1px solid #44ff44;
            color: #66ff66;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .document-reader .main {
                padding: 0 20px 140px; /* Дополнительное место для нижнего навбара на мобильных */
            }
            
            .document-reader .content {
                flex-direction: column;
            }
        }

    </style>
</head>
<body class="document-reader">
    <div id="unified-navbar-container"></div>
    <div class="page">

        <!-- Main Content -->
        <main class="main">
            <div class="content">
                <!-- Main Content Area -->
                <div class="main-content">
                    <!-- Upload Card -->
                    <div class="upload-card">
                        <h2 class="upload-card__title">
                            <i class="fas fa-upload"></i> <span data-i18n-en="Upload document">Загрузка документа</span>
                        </h2>
                        

                        <div class="upload-area" id="uploadArea">
                            <div class="upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <div class="upload-text" data-i18n-en="Drag and drop a file here, or click to select one">Перетащите файл сюда или нажмите для выбора</div>
                            <div class="upload-subtext" data-i18n-en="PDF and Word documents are supported">Поддерживаются PDF и Word документы</div>
                            <div class="supported-formats">
                                <strong data-i18n-en="Supported formats:">Поддерживаемые форматы:</strong><br>
                                <span data-i18n-en="• PDF (.pdf)">• PDF (.pdf)</span><br>
                                <span data-i18n-en="• Microsoft Word (.docx, .doc)">• Microsoft Word (.docx, .doc)</span>
                            </div>
                            <input type="file" id="fileInput" class="file-input" accept=".pdf,.docx,.doc">
                        </div>

                        <div id="fileInfo" class="file-info">
                            <strong data-i18n-en="Selected file:">Выбранный файл:</strong> <span id="fileName"></span><br>
                            <strong data-i18n-en="Size:">Размер:</strong> <span id="fileSize"></span><br>
                            <strong data-i18n-en="Type:">Тип:</strong> <span id="fileType"></span>
                        </div>

                        <div id="extractedText" class="extracted-text">
                            <h3 data-i18n-en="Extracted text:">Извлеченный текст:</h3>
                            <div id="textContent"></div>
                        </div>

                        <!-- Question Section -->
                        <div class="question-section">
                            <h3 class="question-section__title">
                                <i class="fas fa-question-circle"></i> <span data-i18n-en="Ask a question">Задайте вопрос</span>
                            </h3>

                            <textarea
                                id="questionInput"
                                class="question-input"
                                placeholder="Введите ваш вопрос о документе..."
                                data-i18n-en-placeholder="Enter your question about the document..."
                            ></textarea>
                            <button id="askButton" class="ask-button">
                                <i class="fas fa-paper-plane"></i> <span data-i18n-en="Ask question">Задать вопрос</span>
                            </button>

                            <div id="loading" class="loading">
                                <div class="spinner"></div>
                                <div data-i18n-en="Processing request...">Обработка запроса...</div>
                            </div>

                            <div id="answerSection" class="answer-section">
                                <h3><i class="fas fa-lightbulb"></i> <span data-i18n-en="AI Answer:">Ответ ИИ:</span></h3>
                                <div id="answerText" class="answer-text"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Подключение библиотек -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <script>
        class DocumentReader {
            constructor() {
                // AI-запросы идут через серверный прокси (cors-proxy.js /ai/chat) — ключ там, не здесь
                this.extractedText = '';
                this.initializeElements();
                this.setupEventListeners();
            }

            initializeElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.questionInput = document.getElementById('questionInput');
                this.askButton = document.getElementById('askButton');
                this.loading = document.getElementById('loading');
                this.answerSection = document.getElementById('answerSection');
                this.answerText = document.getElementById('answerText');
                this.fileInfo = document.getElementById('fileInfo');
                this.fileName = document.getElementById('fileName');
                this.fileSize = document.getElementById('fileSize');
                this.fileType = document.getElementById('fileType');
                this.extractedTextDiv = document.getElementById('extractedText');
                this.textContent = document.getElementById('textContent');
            }

            setupEventListeners() {
                // Загрузка файла
                this.uploadArea.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));

                // Drag and drop
                this.uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.add('dragover');
                });

                this.uploadArea.addEventListener('dragleave', () => {
                    this.uploadArea.classList.remove('dragover');
                });

                this.uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        this.handleFile(files[0]);
                    }
                });


                // Кнопка вопроса
                this.askButton.addEventListener('click', () => this.askQuestion());
            }

            handleFileSelect(event) {
                const file = event.target.files[0];
                if (file) {
                    this.handleFile(file);
                }
            }

            handleFile(file) {
                this.showFileInfo(file);
                this.extractTextFromFile(file);
            }

            showFileInfo(file) {
                this.fileName.textContent = file.name;
                this.fileSize.textContent = this.formatFileSize(file.size);
                this.fileType.textContent = file.type || 'Unknown type';
                this.fileInfo.style.display = 'block';
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            async extractTextFromFile(file) {
                try {
                    this.showLoading('Extracting text...');
                    
                    const fileExtension = file.name.split('.').pop().toLowerCase();
                    
                    if (fileExtension === 'pdf') {
                        await this.extractFromPDF(file);
                    } else if (fileExtension === 'docx' || fileExtension === 'doc') {
                        await this.extractFromWord(file);
                    } else {
                        throw new Error('Unsupported file format');
                    }
                    
                    this.hideLoading();
                    this.showSuccess('Text successfully extracted from the document!');
                    
                } catch (error) {
                    this.hideLoading();
                    this.showError('Error extracting text: ' + error.message);
                }
            }

            async extractFromPDF(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const typedArray = new Uint8Array(e.target.result);
                            const pdf = await pdfjsLib.getDocument(typedArray).promise;
                            let fullText = '';

                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                const pageText = textContent.items.map(item => item.str).join(' ');
                                fullText += pageText + '\n';
                            }

                            this.extractedText = fullText;
                            this.displayExtractedText();
                            resolve();
                        } catch (error) {
                            reject(error);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            }

            async extractFromWord(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            mammoth.extractRawText({arrayBuffer: e.target.result})
                                .then(result => {
                                    this.extractedText = result.value;
                                    this.displayExtractedText();
                                    resolve();
                                })
                                .catch(error => {
                                    reject(error);
                                });
                        } catch (error) {
                            reject(error);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            }

            displayExtractedText() {
                this.textContent.textContent = this.extractedText.substring(0, 1000) + 
                    (this.extractedText.length > 1000 ? '...' : '');
                this.extractedTextDiv.style.display = 'block';
            }

            async askQuestion() {
                if (!this.extractedText) {
                    this.showError('First upload and extract text from a document');
                    return;
                }

                const question = this.questionInput.value.trim();
                if (!question) {
                    this.showError('Please enter a question');
                    return;
                }

                try {
                    this.showLoading('Getting answer from AI...');
                    this.askButton.disabled = true;

                    const response = await this.callOpenAI(question);
                    
                    this.hideLoading();
                    this.displayAnswer(response);
                    this.askButton.disabled = false;
                    
                } catch (error) {
                    this.hideLoading();
                    this.showError('Error getting the answer: ' + error.message);
                    this.askButton.disabled = false;
                }
            }

            async callOpenAI(question) {
                const lang = (window.SmartScrollI18N && window.SmartScrollI18N.getLang) ? window.SmartScrollI18N.getLang() : 'ru';
                const response = await fetch('/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: 'system',
                                content: lang === 'en'
                                    ? 'You are an assistant that answers questions based on the provided document text. Answer accurately and to the point, in English.'
                                    : 'Вы - помощник, который отвечает на вопросы на основе предоставленного текста документа. Отвечайте точно и по существу, на русском языке.'
                            },
                            {
                                role: 'user',
                                content: lang === 'en'
                                    ? `Document context:\n\n${this.extractedText}\n\nQuestion: ${question}`
                                    : `Контекст документа:\n\n${this.extractedText}\n\nВопрос: ${question}`
                            }
                        ],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API error');
                }

                const data = await response.json();
                return data.choices[0].message.content;
            }

            displayAnswer(answer) {
                this.answerText.innerHTML = this.formatAnswer(answer);
                this.answerSection.style.display = 'block';
            }

            formatAnswer(text) {
                return text.replace(/\n/g, '<br>');
            }

            showLoading(message) {
                this.loading.querySelector('div:last-child').textContent = message;
                this.loading.classList.add('show');
            }

            hideLoading() {
                this.loading.classList.remove('show');
            }

            showError(message) {
                this.showMessage(message, 'error');
            }

            showSuccess(message) {
                this.showMessage(message, 'success');
            }

            showMessage(message, type) {
                // Удаляем предыдущие сообщения
                const existingMessages = document.querySelectorAll('.error, .success');
                existingMessages.forEach(msg => msg.remove());

                const messageDiv = document.createElement('div');
                messageDiv.className = type;
                messageDiv.textContent = message;
                
                const container = document.querySelector('.main-content');
                container.insertBefore(messageDiv, container.firstChild);
                
                setTimeout(() => {
                    messageDiv.remove();
                }, 5000);
            }
        }

        // Функция поиска
        function performSearch() {
            const searchInput = document.getElementById('searchInput');
            const query = searchInput.value.trim();
            
            if (query) {
                console.log('Search:', query);
                alert('Search: ' + query);
            }
        }

        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            new DocumentReader();
            
            // Инициализируем навбар после загрузки
            setTimeout(() => {
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            }, 100);
        });
    </script>
    
</body>
</html>
