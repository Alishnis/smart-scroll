<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scroll - Вход</title>
    <link rel="icon" type="image/png" href="template-logo.png">
    <link rel="stylesheet" href="template-styles.css">
    <link rel="stylesheet" href="auth-styles.css">
    
    <!-- Единая навигация -->
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=3" defer></script>
    
    <!-- Мониторинг яркости экрана -->
    <script src="brightness-monitor.js"></script>
    
    <!-- Auth system -->
    <script src="auth-script.js"></script>
    
    <!-- Smart Currency System -->
        <!-- Button Audio System -->
    <script src="button-audio.js"></script>
<script src="smart-currency.js"></script>

<body>
    <div class="page">
        <!-- Единый навбар -->
        <div id="unified-navbar-container"></div>

        <!-- Main Content -->
        <main class="main">
            <div class="content">
                <!-- Main Content Area -->
                <div class="main-content">
                    <div class="content-card">
                        <div class="content-card__header">
                            <h2 class="content-card__title" data-i18n-en="Sign In">Войти в аккаунт</h2>
                        </div>
                        <div class="content-card__body">
                            <form class="auth-form" id="loginForm">
                                <div class="form-group">
                                    <label for="loginEmail" class="form-label">Email</label>
                                    <input type="email" id="loginEmail" name="email" class="form-input" placeholder="Введите email" data-i18n-en-placeholder="Enter email" required>
                                </div>

                                <div class="form-group">
                                    <label for="loginPassword" class="form-label" data-i18n-en="Password">Пароль</label>
                                    <input type="password" id="loginPassword" name="password" class="form-input" placeholder="Введите пароль" data-i18n-en-placeholder="Enter password" required>
                                </div>

                                <button type="submit" class="auth-button" data-i18n-en="Sign In">Войти</button>
                            </form>

                            <div class="auth-links">
                                <p><span data-i18n-en="Don't have an account? ">Нет аккаунта? </span><a href="register.html" class="auth-link" data-i18n-en="Register">Зарегистрироваться</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Загрузка единого навбара -->
    <script>
        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });
    </script>
</body>
</html>
