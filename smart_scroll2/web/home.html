<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scroll - Home</title>
    <link rel="icon" type="image/png" href="template-logo.png">
    <link rel="stylesheet" href="template-styles.css">
    <link rel="stylesheet" href="auth-styles.css">
    
    <!-- Единая навигация -->
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=3" defer></script>
    
    <!-- Мониторинг яркости экрана -->
    <script src="brightness-monitor.js"></script>
    
    <!-- Auth system -->
    <script src="auth-script.js"></script>
    
    <!-- Smart Currency System -->
        <!-- Button Audio System -->
    <script src="button-audio.js"></script>
<script src="smart-currency.js"></script>
<style>
    @media (max-width: 768px) {
        .content-card {
            min-height: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .content-card__header {
            padding: 20px 20px 12px;
        }

        .content-card__title {
            font-size: 22px;
        }

        .content-card__body {
            padding: 20px;
        }

        .content-card__text {
            font-size: 15px;
        }

        .auth-buttons {
            flex-direction: column;
            align-items: stretch;
        }

        .auth-buttons .auth-button {
            width: 100%;
            min-width: 0;
        }
    }

    @media (max-width: 480px) {
        .content-card__header {
            padding: 16px 16px 10px;
        }

        .content-card__title {
            font-size: 19px;
        }

        .content-card__body {
            padding: 16px;
        }
    }
</style>

<body>
    <div class="page">
        <!-- Единый навбар -->
        <div id="unified-navbar-container"></div>

        <!-- Main Content -->
        <main class="main">
            <div class="content">
                <!-- Main Content Area -->
                <div class="main-content">
                    <div class="content-card">
                        <div class="content-card__header">
                            <h2 class="content-card__title" data-i18n-en="Welcome to Smart Scroll">Добро пожаловать в Smart Scroll</h2>
                        </div>
                        <div class="content-card__body">
                            <p class="content-card__text" data-i18n-en="An educational platform with quizzes, posts, and a news feed. Create an account or log in to an existing one to start using all the features.">
                                Образовательная платформа с викторинами, постами и лентой новостей.
                                Создайте аккаунт или войдите в существующий, чтобы начать пользоваться всеми возможностями.
                            </p>

                            <div class="auth-buttons">
                                <a href="login.html" class="auth-button" data-i18n-en="Log In">Войти</a>
                                <a href="register.html" class="auth-button auth-button--secondary" data-i18n-en="Sign Up">Зарегистрироваться</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Загрузка единого навбара -->
    <script>
        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });
    </script>
</body>
</html>
