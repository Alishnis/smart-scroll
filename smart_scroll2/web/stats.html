<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scroll - Statistics</title>
    <link rel="icon" type="image/png" href="template-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="unified-navbar.css?v=2">
    <script src="unified-navbar.js?v=2"></script>
    <script src="i18n.js?v=3" defer></script>
    
    <!-- Button Audio System -->
    <script src="button-audio.js"></script>
    
    <style>
        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Живой таймер */
        .live-timer-container {
            margin-bottom: 32px;
        }
        
        .live-timer {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(48, 202, 161, 0.3);
            animation: pulse-glow 2s infinite;
        }
        
        .live-timer__icon {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .live-timer__icon svg {
            width: 32px;
            height: 32px;
        }
        
        .live-timer__content {
            flex: 1;
            color: white;
        }
        
        .live-timer__time {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .live-timer__label {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .live-timer__status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse-dot 1.5s infinite;
        }
        
        .status-dot.inactive {
            background: #FF6B6B;
            animation: none;
        }
        
        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 8px 32px rgba(48, 202, 161, 0.3);
            }
            50% { 
                box-shadow: 0 12px 40px rgba(48, 202, 161, 0.5);
            }
        }
        
        @keyframes pulse-dot {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.7;
                transform: scale(1.2);
            }
        }

        /* Статистика стили */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #2E3136 0%, #1E1E1E 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #30CAA1 0%, #20A0FF 100%);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(48, 202, 161, 0.2);
        }
        
        .stat-card__icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            color: #30CAA1;
        }
        
        .stat-card__value {
            font-size: 36px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 8px;
            line-height: 1;
        }
        
        .stat-card__label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }
        
        .stat-card__change {
            font-size: 14px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .stat-card__change--positive {
            background-color: rgba(48, 202, 161, 0.2);
            color: #30CAA1;
        }
        
        .stat-card__change--negative {
            background-color: rgba(255, 99, 99, 0.2);
            color: #FF6363;
        }
        
        .chart-container {
            background: linear-gradient(135deg, #2E3136 0%, #1E1E1E 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .chart-title {
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;
        }
        
        .progress-bar__fill {
            height: 100%;
            background: linear-gradient(90deg, #30CAA1 0%, #20A0FF 100%);
            border-radius: 4px;
            transition: width 0.8s ease;
        }
        
        .daily-stats {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        
        .daily-stat {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .daily-stat:hover {
            background-color: rgba(48, 202, 161, 0.1);
            border-color: #30CAA1;
        }
        
        .daily-stat--today {
            border-color: #30CAA1;
            background-color: rgba(48, 202, 161, 0.1);
        }
        
        .daily-stat--active {
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(48, 202, 161, 0.5);
        }
        
        .daily-stat__day {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }
        
        .daily-stat__value {
            font-size: 16px;
            font-weight: 600;
            color: #FFFFFF;
        }
        
        .achievement-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin: 4px;
        }
        
        .achievements-container {
            background: linear-gradient(135deg, #2E3136 0%, #1E1E1E 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
        }
        
        .achievements-title {
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 16px;
            text-align: center;
        }
        
        .achievements-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        /* Специальные стили для навбара статистики */
        .navbar__item--stats {
            position: relative;
            overflow: hidden;
        }
        
        .navbar__item--stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(48, 202, 161, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .navbar__item--stats:hover::before {
            left: 100%;
        }
        
        .navbar__item--stats .navbar__icon {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Улучшенные стили для активной секции статистики */
        .navbar__item--active.navbar__item--stats {
            background: linear-gradient(135deg, #30CAA1 0%, #20A0FF 100%);
            box-shadow: 0 4px 16px rgba(48, 202, 161, 0.4);
            transform: translateY(-2px);
        }
        
        .navbar__item--active.navbar__item--stats .navbar__icon {
            animation: none;
            transform: scale(1.1);
        }
        
        .navbar__item--active.navbar__item--stats .navbar__text {
            font-weight: 600;
        }
        
        /* Стили для навбара статистики - только специфичные для статистики */
        .navbar::-webkit-scrollbar {
            display: none;
        }
        
        @media (max-width: 768px) {
            .live-timer {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }
            
            .live-timer__time {
                font-size: 36px;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .daily-stats {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .stat-card__value {
                font-size: 28px;
            }
            
            .navbar__item--stats .navbar__icon {
                animation: none;
            }
        }
        
        @media (max-width: 480px) {
            .navbar__icon {
                width: 16px !important;
                height: 16px !important;
            }

            .page-header h1 {
                font-size: 1.6rem;
                padding: 0 8px;
            }

            .live-timer {
                padding: 16px;
            }

            .live-timer__time {
                font-size: 28px;
            }

            .live-timer__icon {
                width: 48px;
                height: 48px;
            }

            .live-timer__icon svg {
                width: 24px;
                height: 24px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-card__value {
                font-size: 24px;
            }

            .daily-stats {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .daily-stat {
                padding: 10px 4px;
                min-height: 44px;
            }

            .daily-stat__day {
                font-size: 11px;
            }

            .daily-stat__value {
                font-size: 13px;
            }

            .achievement-badge {
                padding: 10px 14px;
                min-height: 40px;
                box-sizing: border-box;
            }

            .chart-container,
            .achievements-container {
                padding: 16px;
            }

            .chart-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="unified-navbar-container"></div>
    <div class="page">

        <!-- Main Content -->
        <main class="main">
            <div class="content">
                <!-- Main Content Area -->
                <div class="main-content">
                    <div class="page-header">
                        <h1 data-i18n-en="Your Activity Statistics">Ваша статистика активности</h1>
                    </div>
                            <!-- Живой таймер -->
                            <div class="live-timer-container">
                                <div class="live-timer">
                                    <div class="live-timer__icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                        </svg>
                                    </div>
                                    <div class="live-timer__content">
                                        <div class="live-timer__time" id="liveTimer">00:00:00</div>
                                        <div class="live-timer__label" data-i18n-en="Time on Site">Время на сайте</div>
                                        <div class="live-timer__status" id="activityStatus">
                                            <span class="status-dot" id="statusDot"></span>
                                            <span id="statusText" data-i18n-en="Active">Активен</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Основные метрики -->
                            <div class="stats-container">
                                <div class="stat-card">
                                    <svg class="stat-card__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                    </svg>
                                    <div class="stat-card__value" id="timeSpent">0ч 0м</div>
                                    <div class="stat-card__label" data-i18n-en="Time on Site Today">Время на сайте сегодня</div>
                                    <div class="stat-card__change stat-card__change--positive" id="timeChange" data-i18n-en="+0% vs yesterday">+0% к вчера</div>
                                </div>

                                <div class="stat-card">
                                    <svg class="stat-card__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                    </svg>
                                    <div class="stat-card__value" id="pointsEarned">0</div>
                                    <div class="stat-card__label" data-i18n-en="Activity Points">Очки за активность</div>
                                    <div class="stat-card__change stat-card__change--positive" id="pointsChange" data-i18n-en="+0% vs yesterday">+0% к вчера</div>
                                </div>
                            </div>

                            <!-- Прогресс-бар достижений -->
                            <div class="chart-container">
                                <div class="chart-title" data-i18n-en="Progress to Next Level">Прогресс к следующему уровню</div>
                                <div class="progress-bar">
                                    <div class="progress-bar__fill" style="width: 78%"></div>
                                </div>
                                <div style="text-align: center; color: rgba(255, 255, 255, 0.7); font-size: 14px;" data-i18n-en="1,247 / 1,600 points (78%)">
                                    1,247 / 1,600 очков (78%)
                                </div>
                            </div>

                            <!-- Статистика по дням недели -->
                            <div class="chart-container">
                                <div class="chart-title" data-i18n-en="Weekly Activity">Активность за неделю</div>
                                <div class="daily-stats" id="weeklyStats">
                                    <!-- Данные будут загружены динамически -->
                                </div>
                            </div>

                            <!-- Достижения -->
                            <div class="achievements-container">
                                <div class="achievements-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span data-i18n-en="Achievements Today">Достижения сегодня</span></div>
                                <div class="achievements-grid" id="achievementsGrid">
                                    <!-- Достижения будут загружены динамически -->
                                </div>
                            </div>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Система реального отслеживания времени
        class TimeTracker {
            constructor() {
                this.startTime = Date.now();
                this.sessionStart = Date.now();
                this.totalTime = this.loadTotalTime();
                this.sessionTime = 0;
                this.points = this.loadPoints();
                this.isActive = true;
                this.lastActivity = Date.now();
                
                this.init();
            }
            
            init() {
                console.log('🚀 Инициализация TimeTracker...');
                
                // Загружаем сохраненные данные
                this.loadData();
                console.log(`📊 Загружены данные: ${Math.floor(this.totalTime / 1000 / 60)}м, ${this.points} очков`);
                
                // Отслеживаем активность пользователя
                this.trackActivity();
                
                // Обновляем статистику каждую секунду
                this.updateStats();
                
                // Сохраняем данные каждые 30 секунд
                setInterval(() => {
                    console.log('💾 Автосохранение данных...');
                    this.saveData();
                }, 30000);
                
                // Обработка закрытия/перезагрузки страницы
                window.addEventListener('beforeunload', () => {
                    console.log('💾 Сохранение при закрытии...');
                    this.saveData();
                });
                window.addEventListener('visibilitychange', () => this.handleVisibilityChange());
                
                console.log('✅ TimeTracker инициализирован');
            }
            
            trackActivity() {
                const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
                
                events.forEach(event => {
                    document.addEventListener(event, () => {
                        this.lastActivity = Date.now();
                        if (!this.isActive) {
                            console.log('🟢 Пользователь стал активен');
                            this.isActive = true;
                            this.sessionStart = Date.now();
                        }
                    }, true);
                });
                
                // Проверяем активность каждые 5 секунд
                setInterval(() => {
                    const timeSinceActivity = Date.now() - this.lastActivity;
                    if (timeSinceActivity > 30000 && this.isActive) { // 30 секунд неактивности
                        console.log('🔴 Пользователь неактивен');
                        this.isActive = false;
                    }
                }, 5000);
            }
            
            updateStats() {
                if (this.isActive) {
                    const currentTime = Date.now();
                    const timeDiff = currentTime - this.sessionStart;
                    
                    // Добавляем только новое время (не дублируем)
                    this.totalTime += timeDiff;
                    this.sessionStart = currentTime;
                    
                    // Начисляем очки за активность (1 очко за минуту)
                    const newPoints = Math.floor(timeDiff / 1000 / 60);
                    if (newPoints > 0) {
                        this.points += newPoints;
                    }
                    
                    // Отладочная информация
                    console.log(`🕐 Активность: ${Math.floor(this.totalTime / 1000 / 60)}м, Очки: ${this.points}`);
                }
                
                this.displayStats();
                
                // Обновляем каждую секунду
                setTimeout(() => this.updateStats(), 1000);
            }
            
            displayStats() {
                const timeElement = document.getElementById('timeSpent');
                const pointsElement = document.getElementById('pointsEarned');
                const timeChangeElement = document.getElementById('timeChange');
                const pointsChangeElement = document.getElementById('pointsChange');
                
                // Обновляем живой таймер
                this.updateLiveTimer();
                
                if (timeElement) {
                    const hours = Math.floor(this.totalTime / (1000 * 60 * 60));
                    const minutes = Math.floor((this.totalTime % (1000 * 60 * 60)) / (1000 * 60));
                    timeElement.textContent = `${hours}h ${minutes}m`;
                }
                
                if (pointsElement) {
                    pointsElement.textContent = this.points.toLocaleString();
                }
                
                // Обновляем изменения
                this.updateChanges(timeChangeElement, pointsChangeElement);
                
                // Обновляем прогресс-бар
                this.updateProgressBar();
                
                // Обновляем недельную статистику
                this.loadWeeklyStats();
                
                // Обновляем достижения
                this.loadAchievements();
            }
            
            updateLiveTimer() {
                const liveTimerElement = document.getElementById('liveTimer');
                const statusDotElement = document.getElementById('statusDot');
                const statusTextElement = document.getElementById('statusText');
                
                if (liveTimerElement) {
                    // Форматируем время в ЧЧ:ММ:СС
                    const totalSeconds = Math.floor(this.totalTime / 1000);
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    const seconds = totalSeconds % 60;
                    
                    const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    liveTimerElement.textContent = timeString;
                }
                
                // Обновляем статус активности
                if (statusDotElement && statusTextElement) {
                    if (this.isActive) {
                        statusDotElement.classList.remove('inactive');
                        statusTextElement.textContent = 'Active';
                    } else {
                        statusDotElement.classList.add('inactive');
                        statusTextElement.textContent = 'Inactive';
                    }
                }
            }
            
            updateChanges(timeChangeElement, pointsChangeElement) {
                const yesterdayData = this.getYesterdayData();
                
                if (timeChangeElement && yesterdayData.time > 0) {
                    const timeChange = ((this.totalTime - yesterdayData.time) / yesterdayData.time * 100);
                    const changeText = timeChange >= 0 ? `+${Math.round(timeChange)}% vs yesterday` : `${Math.round(timeChange)}% vs yesterday`;
                    timeChangeElement.textContent = changeText;
                    timeChangeElement.className = `stat-card__change ${timeChange >= 0 ? 'stat-card__change--positive' : 'stat-card__change--negative'}`;
                }

                if (pointsChangeElement && yesterdayData.points > 0) {
                    const pointsChange = ((this.points - yesterdayData.points) / yesterdayData.points * 100);
                    const changeText = pointsChange >= 0 ? `+${Math.round(pointsChange)}% vs yesterday` : `${Math.round(pointsChange)}% vs yesterday`;
                    pointsChangeElement.textContent = changeText;
                    pointsChangeElement.className = `stat-card__change ${pointsChange >= 0 ? 'stat-card__change--positive' : 'stat-card__change--negative'}`;
                }
            }
            
            updateProgressBar() {
                const progressBar = document.querySelector('.progress-bar__fill');
                const progressText = document.querySelector('.chart-container div:last-child');
                
                if (progressBar && progressText) {
                    const progress = Math.min((this.points / 1000) * 100, 100); // 1000 очков = 100%
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `${this.points} / 1,000 points (${Math.round(progress)}%)`;
                }
            }
            
            loadData() {
                const today = new Date().toDateString();
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                
                if (savedData[today]) {
                    this.totalTime = savedData[today].time || 0;
                    this.points = savedData[today].points || 0;
                }
            }
            
            saveData() {
                const today = new Date().toDateString();
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                
                savedData[today] = {
                    time: this.totalTime,
                    points: this.points,
                    lastUpdate: Date.now()
                };
                
                localStorage.setItem('smartScrollStats', JSON.stringify(savedData));
                console.log(`💾 Данные сохранены: ${Math.floor(this.totalTime / 1000 / 60)}м, ${this.points} очков`);
            }
            
            loadTotalTime() {
                const today = new Date().toDateString();
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                return savedData[today]?.time || 0;
            }
            
            loadPoints() {
                const today = new Date().toDateString();
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                return savedData[today]?.points || 0;
            }
            
            getYesterdayData() {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toDateString();
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                
                return savedData[yesterdayStr] || { time: 0, points: 0 };
            }
            
            handleVisibilityChange() {
                if (document.hidden) {
                    this.isActive = false;
                } else {
                    this.isActive = true;
                    this.sessionStart = Date.now();
                    this.lastActivity = Date.now();
                }
            }
            
            loadWeeklyStats() {
                const weeklyStatsContainer = document.getElementById('weeklyStats');
                if (!weeklyStatsContainer) return;
                
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const today = new Date();
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                
                let html = '';
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toDateString();
                    const dayData = savedData[dateStr] || { time: 0, points: 0 };
                    
                    const hours = Math.floor(dayData.time / (1000 * 60 * 60));
                    const minutes = Math.floor((dayData.time % (1000 * 60 * 60)) / (1000 * 60));
                    const timeStr = dayData.time > 0 ? `${hours}h ${minutes}m` : '0h 0m';
                    
                    const isToday = i === 0;
                    const isActive = isToday && this.isActive;
                    
                    html += `
                        <div class="daily-stat ${isToday ? 'daily-stat--today' : ''} ${isActive ? 'daily-stat--active' : ''}" 
                             data-time="${dayData.time}" data-points="${dayData.points}">
                            <div class="daily-stat__day">${days[date.getDay()]}</div>
                            <div class="daily-stat__value">${timeStr}</div>
                        </div>
                    `;
                }
                
                weeklyStatsContainer.innerHTML = html;
                
                // Добавляем обработчики событий для новых элементов
                weeklyStatsContainer.querySelectorAll('.daily-stat').forEach(stat => {
                    stat.addEventListener('click', function() {
                        const day = this.querySelector('.daily-stat__day').textContent;
                        const value = this.querySelector('.daily-stat__value').textContent;
                        const time = parseInt(this.dataset.time) || 0;
                        const points = parseInt(this.dataset.points) || 0;
                        
                        showNotification(`${day}: ${value} activity, ${points} points`);
                    });
                });
            }
            
            loadAchievements() {
                const achievementsContainer = document.getElementById('achievementsGrid');
                if (!achievementsContainer) return;
                
                const achievements = [];
                const hours = Math.floor(this.totalTime / (1000 * 60 * 60));
                const minutes = Math.floor((this.totalTime % (1000 * 60 * 60)) / (1000 * 60));
                
                // Проверяем достижения
                if (this.points >= 1000) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>', text: '1000+ points', color: '#30CAA1' });
                }
                if (this.points >= 500) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>', text: '500+ points', color: '#20A0FF' });
                }
                if (hours >= 4) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>', text: '4+ hours active', color: '#FF6B6B' });
                }
                if (hours >= 2) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 12c0-1.23-1.02-2.5-2.5-2.5s-2.5 1.27-2.5 2.5 1.02 2.5 2.5 2.5 2.5-1.27 2.5-2.5zm-2.5-1c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-7 1c0-1.23-1.02-2.5-2.5-2.5S4 10.77 4 12s1.02 2.5 2.5 2.5S9 13.23 9 12zm-2.5 0c0-.55.45-1 1-1s1 .45 1 1-.45 1-1 1-1-.45-1-1z"/></svg>', text: '2+ hours active', color: '#FFD93D' });
                }
                if (this.points >= 100) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>', text: '100+ points', color: '#6BCF7F' });
                }
                if (minutes >= 30) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>', text: '30+ minutes', color: '#A8E6CF' });
                }
                
                // Проверяем стрик (дни подряд с активностью)
                const streak = this.calculateStreak();
                if (streak >= 7) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 12c0-1.23-1.02-2.5-2.5-2.5s-2.5 1.27-2.5 2.5 1.02 2.5 2.5 2.5 2.5-1.27 2.5-2.5zm-2.5-1c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-7 1c0-1.23-1.02-2.5-2.5-2.5S4 10.77 4 12s1.02 2.5 2.5 2.5S9 13.23 9 12zm-2.5 0c0-.55.45-1 1-1s1 .45 1 1-.45 1-1 1-1-.45-1-1z"/></svg>', text: `${streak}-day streak`, color: '#FF6B6B' });
                } else if (streak >= 3) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 12c0-1.23-1.02-2.5-2.5-2.5s-2.5 1.27-2.5 2.5 1.02 2.5 2.5 2.5 2.5-1.27 2.5-2.5zm-2.5-1c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-7 1c0-1.23-1.02-2.5-2.5-2.5S4 10.77 4 12s1.02 2.5 2.5 2.5S9 13.23 9 12zm-2.5 0c0-.55.45-1 1-1s1 .45 1 1-.45 1-1 1-1-.45-1-1z"/></svg>', text: `${streak}-day streak`, color: '#FFD93D' });
                }

                if (achievements.length === 0) {
                    achievements.push({ icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>', text: 'Get started!', color: '#87CEEB' });
                }
                
                let html = '';
                achievements.forEach(achievement => {
                    html += `
                        <div class="achievement-badge" style="background: linear-gradient(135deg, ${achievement.color}20 0%, ${achievement.color}40 100%); border-color: ${achievement.color};">
                            <span>${achievement.icon}</span>
                            <span>${achievement.text}</span>
                        </div>
                    `;
                });
                
                achievementsContainer.innerHTML = html;
            }
            
            calculateStreak() {
                const savedData = JSON.parse(localStorage.getItem('smartScrollStats') || '{}');
                const today = new Date();
                let streak = 0;
                
                for (let i = 0; i < 30; i++) { // Проверяем последние 30 дней
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toDateString();
                    const dayData = savedData[dateStr];
                    
                    if (dayData && dayData.time > 0) {
                        streak++;
                    } else {
                        break;
                    }
                }
                
                return streak;
            }
        }

        // Функции для тестирования и отладки
        function testStats() {
            console.log('🧪 Тестирование статистики...');
            const timeTracker = window.timeTracker;
            if (timeTracker) {
                console.log('📊 Текущие данные:', {
                    totalTime: timeTracker.totalTime,
                    points: timeTracker.points,
                    isActive: timeTracker.isActive,
                    sessionStart: timeTracker.sessionStart
                });
                
                // Добавляем тестовые данные
                timeTracker.totalTime += 60000; // +1 минута
                timeTracker.points += 1;
                timeTracker.saveData();
                timeTracker.displayStats();
                
                console.log('✅ Тестовые данные добавлены');
            }
        }
        
        function resetStats() {
            console.log('🔄 Сброс статистики...');
            localStorage.removeItem('smartScrollStats');
            location.reload();
        }
        
        // Дополнительная функциональность для статистики
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализируем трекер времени
            const timeTracker = new TimeTracker();
            window.timeTracker = timeTracker; // Делаем доступным глобально для отладки

            // Анимация появления карточек статистики
            const statCards = document.querySelectorAll('.stat-card');
            statCards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 200);
            });

            // Интерактивность для дневной статистики
            const dailyStats = document.querySelectorAll('.daily-stat');
            dailyStats.forEach(stat => {
                stat.addEventListener('click', function() {
                    const day = this.querySelector('.daily-stat__day').textContent;
                    const value = this.querySelector('.daily-stat__value').textContent;
                    
                    showNotification(`${day}: ${value} activity`);
                });
            });

            // Специальная функциональность для навбара статистики
            const statsNavItem = document.querySelector('.navbar__item--stats');
            if (statsNavItem) {
                // Добавляем эффект при наведении
                statsNavItem.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-3px) scale(1.05)';
                });
                
                statsNavItem.addEventListener('mouseleave', function() {
                    if (!this.classList.contains('navbar__item--active')) {
                        this.style.transform = 'translateY(0) scale(1)';
                    }
                });

                // Анимация при клике
                statsNavItem.addEventListener('click', function() {
                    // Создаем эффект волны
                    const ripple = document.createElement('div');
                    ripple.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(48, 202, 161, 0.6);
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        pointer-events: none;
                        width: 20px;
                        height: 20px;
                        left: 50%;
                        top: 50%;
                        margin-left: -10px;
                        margin-top: -10px;
                    `;
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            }

            // Убеждаемся, что навбар прокручивается для показа всех элементов
            const navbar = document.querySelector('.navbar');
            if (navbar) {
                // Добавляем плавную прокрутку
                navbar.style.scrollBehavior = 'smooth';
                
                // Автоматически прокручиваем к активному элементу
                const activeItem = navbar.querySelector('.navbar__item--active');
                if (activeItem) {
                    setTimeout(() => {
                        activeItem.scrollIntoView({ 
                            behavior: 'smooth', 
                            block: 'nearest',
                            inline: 'center'
                        });
                    }, 100);
                }
            }
        });

        // Стили для выбранной опции квиза и анимации
        const quizStyle = document.createElement('style');
        quizStyle.textContent = `
            .quiz-card__option--selected {
                background-color: #30CAA1 !important;
                color: #000000 !important;
                border-color: #30CAA1 !important;
            }
            
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(quizStyle);

        // Навигация для навбара
        function initNavbar() {
            const navbarItems = document.querySelectorAll('.navbar__item');
            
            navbarItems.forEach(item => {
                item.addEventListener('click', function() {
                    const text = this.querySelector('.navbar__text').textContent;
                    
                    // Удаляем активный класс со всех элементов
                    navbarItems.forEach(navItem => {
                        navItem.classList.remove('navbar__item--active');
                    });
                    
                    // Добавляем активный класс к текущему элементу
                    this.classList.add('navbar__item--active');
                    
                    // Навигация по страницам
                    switch(text) {
                        case 'Лента':
                            window.location.href = 'feed.html';
                            break;
                        case 'Посты':
                            window.location.href = 'posts.html';
                            break;
                        case 'Статистика':
                            // Уже на странице статистики
                            break;
                        case 'Настройки':
                            window.location.href = 'settings.html';
                            break;
                        case 'Профиль':
                            window.location.href = 'profile.html';
                            break;
                        default:
                            console.log('Неизвестная страница:', text);
                    }
                });
            });
        }

        // Загружаем единый навбар
        fetch('unified-navbar.html?v=3')
            .then(response => response.text())
            .then(html => {
                document.getElementById('unified-navbar-container').innerHTML = html;
                // Инициализируем навбар после загрузки
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки единого навбара:', error);
            });

        // Инициализируем навигацию при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализируем навбар после загрузки
            setTimeout(() => {
                if (window.initializeNavbar) {
                    window.initializeNavbar();
                }
            }, 100);
        });
    </script>
