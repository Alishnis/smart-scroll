name: Publish image

# Builds the single-container image (smart_scroll2/space/Dockerfile.space) and
# pushes it to GitHub Container Registry so a platform such as SnapDeploy can
# pull it. Uses only the built-in GITHUB_TOKEN; no other secrets are needed.

on:
  push:
    branches: [main]
    paths:
      - "smart_scroll2/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alishnis/smart-scroll # registry path must be lowercase

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: smart_scroll2
          file: smart_scroll2/space/Dockerfile.space
          platforms: linux/amd64 # Fargate-based hosts run amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
