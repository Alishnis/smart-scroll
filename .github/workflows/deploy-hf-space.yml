name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "smart_scroll2/**"
      - "scripts/stage_hf_space.sh"
      - "scripts/upload_hf_space.py"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_SPACE_ID" ]; then
            echo "HF_SPACE_ID repository variable is not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_SPACE_ID is set but the HF_TOKEN secret is missing."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          python-version: "3.11"

      - name: Stage Space folder
        if: steps.cfg.outputs.enabled == 'true'
        run: scripts/stage_hf_space.sh build/hf-space

      - name: Upload to Hugging Face
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          pip install --quiet huggingface_hub
          python scripts/upload_hf_space.py build/hf-space
